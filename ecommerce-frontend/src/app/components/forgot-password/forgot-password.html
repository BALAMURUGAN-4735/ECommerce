<div class="forgot-wrapper">
  <div class="forgot-card">
    
    <div class="forgot-header">
      <div class="brand-logo">
        <span class="cart-icon">🛒</span>
        <h1 class="brand-title">MicroMarket</h1>
      </div>
      <h2>Reset Password</h2>
      <p>Enter your account email and new password to restore access</p>
    </div>

    <div class="input-group">
      <label>Registered Email Address</label>
      <input type="email" [(ngModel)]="email" placeholder="name@example.com" />
    </div>

    <div class="input-group">
      <label>New Password</label>
      <input type="password" [(ngModel)]="newPassword" placeholder="Enter new password" />
    </div>

    <div class="input-group">
      <label>Confirm New Password</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm new password" />
    </div>

    <button class="btn-forgot" (click)="onResetPassword()">Update Password</button>

    <p class="switch-mode">
      Remembered your password? <span (click)="goToLogin()">Back to Login</span>
    </p>

  </div>
</div>
