<div class="login-wrapper">
  <div class="login-card">
    
    <div class="login-header">
      <div class="brand-logo">
        <span class="cart-icon">🛒</span>
        <h1 class="brand-title">MicroMarket</h1>
      </div>
      <h2>Secure Login</h2>
      <p>Please authenticate to access your transactions and account</p>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" [(ngModel)]="email" placeholder="name@example.com" />
    </div>
    
    <div class="input-group">
      <div class="label-row">
        <label>Password Verification Key</label>
       </div>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" />
          <span class="forgot-link" routerLink="/forgot-password">Forgot Password?</span> 

    </div>
    <button class="btn-login" (click)="onLogin()">Sign In</button>
    
    <p class="switch-mode">
      New to the platform? <span (click)="goToSignup()">Create an Account</span>
    </p>

  </div>
</div>
